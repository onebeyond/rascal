name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_COLOR: 1
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        rabbitmq: ["3", "4"]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
